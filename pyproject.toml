[project]
name = "autonomous-affiliate-engine"
version = "0.1.0"
description = "Autonomous affiliate campaign engine"
readme = "README.md"
requires-python = ">=3.14"

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["UP045"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
