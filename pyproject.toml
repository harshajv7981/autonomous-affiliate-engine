[project]
name = "autonomous-affiliate-engine"
version = "0.1.0"
description = "Autonomous affiliate campaign engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi[standard]>=0.128.0",
  "pydantic-settings>=2.11.0",
  "httpx>=0.28.0",
  "SQLAlchemy>=2.0.0,<3.0.0",
  "alembic>=1.13.0,<2.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "redis>=5.0.0,<7.0.0",
  "ruff>=0.9.0,<1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["UP045"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
